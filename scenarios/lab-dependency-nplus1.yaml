# yaml-language-server: $schema=./run-manifest.v1.schema.json
# Fallo conocido: N+1 contra una dependencia lenta (Lab:Faults:DependencyNPlusOne). La dependencia de precios
# es un MOCK declarado (contrato dotnet/lab/contracts/pricing.json, latencia 30–50 ms): el informe la marca como
# simulada. Síntoma esperado: latencia alta incluso con 1 VU, CPU baja; las estadísticas del mock muestran
# 5 llamadas secuenciales por petición que explican la latencia.
schemaVersion: 1
name: lab-dependency-nplus1
profile: local-isolated
environment: lab

api:
  project: dotnet/lab/PerfLab.Api/PerfLab.Api.csproj
  healthPath: /health
  settings:
    Lab__Faults__DependencyNPlusOne: "true"

endpoints:
  - name: dependency-quote
    method: GET
    path: /api/dependency/quote
    expectedStatus: 200
    bodyContains: '"pricingSource":"http"'

dependencies:
  pricing-api:
    mode: mock
    required: true
    contract: dotnet/lab/contracts/pricing.json
    injectAs: Dependencies__Pricing__BaseUrl

load:
  endpointSource: declared
  smoke:
    vus: 1
    iterations: 5
    maxDuration: 30s
  baseline:
    executor: constant-vus
    vus: 10
    duration: 20s
