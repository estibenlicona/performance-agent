# yaml-language-server: $schema=./run-manifest.v1.schema.json
# Fallo conocido: espera síncrona sobre una operación asíncrona (sync-over-async) en la ruta de la petición
# (Lab:Faults:Blocking). Síntoma esperado: latencia muy superior a la espera simulada bajo concurrencia,
# CPU baja, cola del ThreadPool y ajustes por starvation; la muestra de pilas señala Task.Wait desde
# PerfLab.Api.BlockingReportService.BlockThread.
schemaVersion: 1
name: lab-blocking
profile: local-isolated
environment: lab

api:
  project: dotnet/lab/PerfLab.Api/PerfLab.Api.csproj
  healthPath: /health
  settings:
    Lab__Faults__Blocking: "true"

endpoints:
  - name: blocking-report
    method: GET
    path: /api/blocking/report
    expectedStatus: 200
    bodyContains: waitedMs

load:
  endpointSource: declared
  smoke:
    vus: 1
    iterations: 5
    maxDuration: 30s
  baseline:
    executor: constant-vus
    vus: 24
    duration: 20s
