# yaml-language-server: $schema=../schemas/run-manifest.v1.schema.json
# EJEMPLO de perfil local-hybrid: API local con una dependencia remota real (autorizada y comprobada en el
# preflight) y otra simulada. No se ejecuta tal cual: el host remoto debe añadirse antes a
# allowedRemoteDependencyHosts en perf-lab.policy.json y la API debe tener su propia credencial de desarrollo.
# Si la dependencia remota requerida no es alcanzable (DNS/TCP/TLS/salud) o devuelve 401/403, el
# diagnóstico queda BLOQUEADO: no se sustituye en silencio por un mock.
schemaVersion: 1
name: local-hybrid-example
profile: local-hybrid
environment: dev

api:
  project: lab/PerfLab.Api/PerfLab.Api.csproj
  healthPath: /health
  settings:
    Lab__Faults__DependencyNPlusOne: "false"

endpoints:
  - name: dependency-quote
    method: GET
    path: /api/dependency/quote
    expectedStatus: 200

dependencies:
  pricing-api:
    mode: remote
    required: true
    url: https://pricing.dev.example.com
    healthPath: /health
    authentication: developer-credential
    injectAs: Dependencies__Pricing__BaseUrl
  inventory-api:
    mode: mock
    required: false
    contract: lab/contracts/pricing.json
    injectAs: Dependencies__Inventory__BaseUrl

load:
  endpointSource: declared
  smoke:
    vus: 1
    iterations: 3
    maxDuration: 30s
  baseline:
    executor: ramping-vus
    vus: 5
    rampUp: 10s
    duration: 30s

safety:
  productionTargets: deny
  writeOperations: deny
  secretsInModelContext: deny
  requireConfirmation: [baseline, runtime-capture]
