# yaml-language-server: $schema=../schemas/run-manifest.v1.schema.json
# Dependencia con errores intermitentes: el mock declarado (lab/contracts/pricing-flaky.json) devuelve 503
# en ~5% de las llamadas y la API los propaga como 502. Síntoma esperado: tasa de error ~5% bajo carga;
# hipótesis de errores propagados desde la dependencia (simulada).
schemaVersion: 1
name: lab-dependency-errors
profile: local-isolated
environment: lab

api:
  project: lab/PerfLab.Api/PerfLab.Api.csproj
  healthPath: /health

endpoints:
  - name: dependency-quote
    method: GET
    path: /api/dependency/quote
    expectedStatus: 200

dependencies:
  pricing-api:
    mode: mock
    required: true
    contract: lab/contracts/pricing-flaky.json
    injectAs: Dependencies__Pricing__BaseUrl

load:
  endpointSource: declared
  smoke:
    vus: 1
    iterations: 10
    maxDuration: 30s
  baseline:
    executor: constant-vus
    vus: 10
    duration: 20s
  thresholds:
    http_req_failed: ['rate<0.01']
