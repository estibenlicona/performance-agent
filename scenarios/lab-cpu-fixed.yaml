# yaml-language-server: $schema=./run-manifest.v1.schema.json
# Validación del "arreglo" del fallo de CPU: mismo escenario y carga que lab-cpu.yaml, con el fallo desactivado
# (el resultado se calcula una vez y se reutiliza). Compara ambas ejecuciones con perf-lab/compare_runs:
# deben ser comparables (mismo escenario, carga, perfil y máquina) y el p95 debe mejorar.
schemaVersion: 1
name: lab-cpu-fixed
profile: local-isolated
environment: lab

api:
  project: dotnet/lab/PerfLab.Api/PerfLab.Api.csproj
  healthPath: /health
  openApiPath: /openapi/v1.json
  settings:
    Lab__Faults__Cpu: "false"

load:
  endpointSource: openapi
  include: [GetCpuReport]
  smoke:
    vus: 1
    iterations: 10
    maxDuration: 30s
  baseline:
    executor: constant-vus
    vus: 16
    duration: 20s
  thresholds:
    http_req_failed: ['rate<0.01']

diagnostics:
  cpuTrace: on-demand
