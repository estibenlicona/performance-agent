# yaml-language-server: $schema=./run-manifest.v1.schema.json
# Línea base del laboratorio sin fallos activos (perfil local-isolated).
# Sirve como control: con la carga probada no debería observarse degradación.
schemaVersion: 1
name: local-baseline
description: API de laboratorio sana; endpoints descubiertos por OpenAPI (solo GET/HEAD; las escrituras se excluyen).
profile: local-isolated
environment: lab

api:
  project: dotnet/lab/PerfLab.Api/PerfLab.Api.csproj
  configuration: Release
  aspNetCoreEnvironment: Development
  healthPath: /health
  openApiPath: /openapi/v1.json
  readinessTimeoutSeconds: 60

load:
  engine: k6
  endpointSource: openapi
  include: [GetBaseline, GetProduct, GetCpuReport, GetAllocationReport]
  smoke:
    vus: 1
    iterations: 8
    maxDuration: 30s
  baseline:
    executor: constant-vus
    vus: 8
    duration: 20s
  thresholds:
    http_req_failed: ['rate<0.01']
    http_req_duration: ['p(95)<500']

diagnostics:
  runtimeCounters: true
  counterIntervalSeconds: 1
  cpuTrace: on-demand
  memoryDump: disabled

safety:
  productionTargets: deny
  writeOperations: deny
  secretsInModelContext: deny
