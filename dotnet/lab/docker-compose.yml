# Dependencias del laboratorio en contenedor (dependencies.<nombre>.mode: container).
# NO VERIFICADO en la máquina de referencia (sin Docker): ver docs/tested-matrix.md.
# Uso desde un manifiesto:
#   dependencies:
#     pricing-api:
#       mode: container
#       composeFile: dotnet/lab/docker-compose.yml
#       service: pricing-mock
#       port: 18081
#       injectAs: Dependencies__Pricing__BaseUrl
# El laboratorio ejecuta `docker compose -p perflab-<runId> up -d --wait <service>` y `down -v` al limpiar.
services:
  pricing-mock:
    image: wiremock/wiremock:3.9.1
    command: ["--port", "8080", "--disable-banner"]
    ports:
      - "127.0.0.1:18081:8080"
    volumes:
      - ./contracts/wiremock:/home/wiremock/mappings:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/__admin/health"]
      interval: 2s
      timeout: 2s
      retries: 15
